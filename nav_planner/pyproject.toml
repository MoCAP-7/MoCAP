[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yor-nav-planner"
version = "0.1.0"
description = "VLM scene-memory and navigation-advice planner for YOR"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.20,<3",
    "imageio-ffmpeg>=0.6,<1",
    "openai>=2.0,<4",
]

[project.scripts]
nav-planner = "nav_planner.cli:main"
nav-planner-enrich-memory = "nav_planner.enrich_cli:main"
nav-planner-readiness = "nav_planner.readiness_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nav_planner*"]
