# Earlier CaP-X variant with a YOR-authored vocabulary (superseded by
# r1pro.yaml, the baseline with Cap-X's own API and prompt): the base moves
# only with the coarse CaP-X vocabulary (go_forward 1 m, turn_left_45_degrees,
# turn_right_45_degrees, goto_planar_position, say_something) and manipulation
# is Cap-X's top SAM3 instance, top Contact-GraspNet grasp and direct Cartesian
# motion, behind YOR's clearance gate. No startup navigation planner advises
# the policy. The task suite, the wall-clock limit (agent.time_limit_s) and the
# primitive defaults come from the shared comparison config of the YOR
# conditions.
condition: capx_coarse
navigation: coarse
yor_agent_config: ../../../yor_agent/configs/nav_comparison.yaml

allowed_tasks:
  - find_blue_trash_bin
  - find_printing_machine
  - find_cardbox_on_storage_cabinet
  - find_can_on_table
  - find_marker_on_table
  - grasp_cardboard_box
  - grasp_can
  - find_can_and_give_back
  - throw_box_to_trash_bin

capx_manipulation:
  # Cap-X open_gripper/close_gripper use the real guarded Nero RPC by default.
  # Set true only for an explicitly labeled dry pipeline trial.
  simulate_gripper: false

policy:
  provider: openai
  model: gpt-5.6-sol
  server_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  temperature: 1.0
  max_tokens: 20480
  reasoning_effort: medium
  use_visual_feedback: true
  use_img_differencing: false
  use_video_differencing: false
  visual_differencing_model: gpt-5.6-sol
  visual_differencing_model_server_url: https://api.openai.com/v1
  visual_differencing_api_key_env: OPENAI_API_KEY
  record_video: false
  save_multiturn_prompts: true
  debug: false

output_root: ../../../outputs/capx

multi_turn_prompt: |
  The following code was just executed:
  ```python
  {executed_code}
  ```
  Current console stdout:
  ```
  {console_stdout}
  ```
  Current console stderr:
  ```
  {console_stderr}
  ```
  Inspect the new visual observation and primitive feedback. If the task is not
  visibly complete, regenerate only the next useful, conservative code block.
