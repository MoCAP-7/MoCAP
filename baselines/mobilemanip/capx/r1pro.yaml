# The CaP-X baseline for the physical YOR robot: Cap-X's R1Pro mobile
# manipulation API (capx/integrations/r1pro/control.py) with its prompt,
# multi-turn prompt, constants and failure semantics, on YOR. navigate_to_pose
# turns toward the goal, drives straight and turns to the goal heading with
# the base controller's obstacle check off (ZED odometry frame, Cap-X's
# waypoint fallback), find_object_base_rotate turns the base in place, and the
# arm calls use the Pi arm RPC. No YOR clearance gate, Nav2, docking,
# manipulation-readiness primitive or advice text is involved, and no startup
# planner advises the policy; a robot about to collide is stopped by the
# operator (Ctrl+C) and the episode fails.
# The task suite and the wall-clock limit (agent.time_limit_s) come from the
# shared comparison config of the YOR conditions.
condition: capx
navigation: r1pro
yor_agent_config: ../../../yor_agent/configs/nav_comparison.yaml

allowed_tasks:
  - find_blue_trash_bin
  - find_printing_machine
  - find_cardbox_on_storage_cabinet
  - find_can_on_table
  - find_marker_on_table
  - grasp_cardboard_box
  - grasp_can
  - find_can_and_give_back
  - throw_box_to_trash_bin

# Sentences appended to the Goal line, like the task hints of Cap-X's R1Pro
# pick-up-trash prompt. Empty: the Goal is the task instruction and the time
# limit alone.
task_hints: ""

capx_manipulation:
  # Cap-X open_gripper/close_gripper use the real guarded Nero RPC by default.
  # Set true only for an explicitly labeled dry pipeline trial.
  simulate_gripper: false

policy:
  provider: openai
  model: gpt-5.6-sol
  server_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  temperature: 1.0
  max_tokens: 20480
  reasoning_effort: medium
  use_visual_feedback: true
  use_img_differencing: false
  use_video_differencing: false
  visual_differencing_model: gpt-5.6-sol
  visual_differencing_model_server_url: https://api.openai.com/v1
  visual_differencing_api_key_env: OPENAI_API_KEY
  record_video: false
  save_multiturn_prompts: true
  debug: false

output_root: ../../../outputs/capx

# Cap-X's R1Pro multi-turn prompt (env_configs/r1pro/*.yaml), verbatim.
multi_turn_prompt: |
  The following code blocks were just executed:
  ```python
  {executed_code}
  ```
  The current console stdout is:
  ```
  {console_stdout}
  ```
  The current console stderr is:
  ```
  {console_stderr}
  ```
  If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
  Consider querying the environment state through perception-based tool calls and prints to see if the task is completed.
  Please respond with EXACTLY ONE of the following:
  - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
  - The word 'FINISH' if the task appears to be complete
